name: nix

on:
  push:
    branches: [personal]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Lock
        run: nix flake lock
      - name: Build
        run: nix build -L
      - name: Check
        run: nix flake check -L
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flake.lock
          path: flake.lock
